version: '3.8'

services:
  # 1. Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: signus
#    ports:
#      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/banco-de-dados.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rede-interna

  # 2. Backend Node.js
  backend:
    build: ./backend
    container_name: backend_node
    restart: always
#    ports:
#      - "3000:3000"
    environment:
      PORT: 3001
      DB_HOST: db       
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_DATABASE: signus
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    networks:
      - rede-interna

  # 3. Frontend React (Vite)
  frontend:
    build: ./frontend
    container_name: frontend_react
    restart: always
#    ports:
#      - "5173:5173"
    networks:
      - rede-externa

  # 4. Proxy Reverso Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - rede-interna
      - rede-externa

networks:
  rede-externa:
    driver: bridge
  rede-interna:
    driver: bridge

volumes:
  db_data: